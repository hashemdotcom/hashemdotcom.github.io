<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c9beb6" />
    <title>دعوت‌نامه عروسی</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-label="دعوت‌نامه عروسی">
      <div class="backdrop" aria-hidden="true">
        <span class="lace lace--left"></span>
        <span class="lace lace--right"></span>
      </div>

      <div class="sparkles" id="sparkles" aria-hidden="true"></div>

      <button class="envelope-stage" id="envelope" type="button" aria-label="باز کردن دعوت‌نامه" aria-expanded="false">
        <span class="envelope-shadow" aria-hidden="true"></span>

        <span class="envelope">
          <span class="envelope__back"></span>

          <img
            class="invitation"
            src="assets/images/invitation.png"
            alt="دعوت‌نامه عاطفه و رامین؛ جمعه ۲۳ مرداد، ساعت ۱۹ تا ۲۲، تهران، عمارت مجنون"
          />

          <span class="envelope__front envelope__front--left"></span>
          <span class="envelope__front envelope__front--right"></span>
          <span class="envelope__front envelope__front--bottom"></span>
          <span class="envelope__flap"></span>

          <span class="seal" aria-hidden="true">
            <img src="assets/images/seal.png" alt="" />
          </span>

          <span class="tap-copy">روی پاکت بزنید</span>
        </span>
      </button>
    </main>

    <footer class="controls">
      <div class="controls__inner">
        <button class="icon-button" id="musicButton" type="button" aria-label="پخش موسیقی" title="موسیقی">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13M9 18c0 1.7-1.8 3-4 3s-4-1.3-4-3 1.8-3 4-3 4 1.3 4 3Zm10-2c0 1.7-1.8 3-4 3s-4-1.3-4-3 1.8-3 4-3 4 1.3 4 3Z" /></svg>
        </button>
        <button class="details-button" id="detailsButton" type="button">اطلاعات مراسم</button>
        <button class="icon-button controls__fullscreen" id="fullscreenButton" type="button" aria-label="نمایش تمام‌صفحه" title="تمام‌صفحه">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5" /></svg>
        </button>
      </div>
    </footer>

    <dialog class="details" id="detailsDialog">
      <button class="details__close" id="closeDetails" type="button" aria-label="بستن">×</button>
      <p class="details__kicker">جشن پیوند ما</p>
      <h2>اطلاعات مراسم</h2>
      <dl>
        <div><dt>تاریخ</dt><dd>جمعه، ۲۳ مرداد</dd></div>
        <div><dt>ساعت</dt><dd>۱۹:۰۰</dd></div>
        <div><dt>نشانی</dt><dd>تهران، عمارت مجنون</dd></div>
      </dl>
      <a
        class="details__map-link"
        href="https://www.google.com/maps/dir/?api=1&amp;destination=35.6647378%2C51.2293936&amp;travelmode=driving"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="نمایش محل مراسم در گوگل مپ"
      >
        <svg class="details__map-logo" viewBox="0 0 32 32" aria-hidden="true">
          <path fill="#34a853" d="M16 2a10 10 0 0 0-10 10c0 7.5 10 18 10 18s10-10.5 10-18A10 10 0 0 0 16 2Z"/>
          <path fill="#fbbc04" d="M6 12c0 3.3 2.2 7.6 4.7 11.2L16 16l-5.8-8A9.9 9.9 0 0 0 6 12Z"/>
          <path fill="#4285f4" d="M16 2a10 10 0 0 0-5.8 1.9L16 12l8.1-4.2A10 10 0 0 0 16 2Z"/>
          <path fill="#ea4335" d="M24.1 7.8 16 12v4l5.3 7.2C23.8 19.6 26 15.3 26 12c0-1.5-.3-2.9-.9-4.2Z"/>
          <circle cx="16" cy="12" r="3.5" fill="#fff"/>
        </svg>
        <span>مشاهده مسیر در Google Maps</span>
      </a>
      <p class="details__note">مشتاق دیدارتان هستیم</p>
    </dialog>

    <audio id="music" src="assets/audio/wedding-song.mp3" loop preload="auto"></audio>

    <script src="script.js"></script>
  </body>
</html>
